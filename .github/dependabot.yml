version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly

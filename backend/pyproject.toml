[project]
name = "sattrack"
version = "0.1.0"
description = "Backend for Satellite Tracker: ingests orbital elements from CelesTrak and serves them over a REST API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sattrack-ingest = "sattrack.ingest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sattrack"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import sorting
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit security rules
  "C90",           # mccabe complexity
  "N",             # naming
  "SIM",           # simplify
  "RUF",
  "T20",           # no print()
  "DTZ",           # timezone-aware datetimes
]

[tool.ruff.lint.mccabe]
# Complexity threshold chosen by the project owner; enforced by the linter, not by review.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["sattrack"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a PostgreSQL database (SATTRACK_TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["sattrack"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]
